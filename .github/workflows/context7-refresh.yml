name: Refresh Context7

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'context7.json'
      - 'packages/docs/docs/**'
      - 'packages/cli/README.md'
      - 'packages/plugins/**/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      CONTEXT7_LIBRARY_ID: ${{ vars.CONTEXT7_LIBRARY_ID }}
    steps:
      - name: Refresh repository library in Context7
        if: ${{ env.CONTEXT7_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CONTEXT7_LIBRARY_ID" ]; then
            CONTEXT7_LIBRARY_ID="/${GITHUB_REPOSITORY}"
          fi
          payload="$(jq -n --arg libraryName "$CONTEXT7_LIBRARY_ID" '{libraryName: $libraryName}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://context7.com/api/v1/refresh \
            --header "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$payload"

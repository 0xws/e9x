name: Submit documentation to Context7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://0xws.github.io' }}
      DOCS_BASE: ${{ vars.DOCS_BASE || '/e9x/' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::bun.lock is not committed yet; using a non-frozen install. Commit bun.lock for reproducible runs."
            bun install
          fi
      - name: Submit hosted llms.txt
        run: bun run --filter @elysia9x/docs context7:submit

name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::bun.lock is not committed yet; using a non-frozen install. Commit bun.lock for reproducible builds."
            bun install
          fi
      - name: Build documentation
        env:
          DOCS_SITE_URL: https://0xws.github.io
          DOCS_BASE: /e9x/
        run: bun run --filter @elysia9x/docs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/docs/.vitepress/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

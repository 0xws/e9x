name: Dependency review

on:
  pull_request:

# Dependency review uses GitHub's dependency graph compare API. The repository
# dependency graph must be enabled in Settings > Advanced Security.
permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
